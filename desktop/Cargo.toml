[package]
name = "hotspotshade-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "hotspotshade_desktop"
path = "src/lib.rs"

[[bin]]
name = "hotspotshade-desktop"
path = "src/main.rs"

[features]
# Build the hidden-webview smoke test. The feature adds no production code.
webview-smoke = []

[[test]]
name = "webview_smoke"
path = "tests/webview_smoke.rs"
harness = false
required-features = ["webview-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hotspotshade = { path = "../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
